[build]
  builder = "NIXPACKS"
  buildCommand = "npm run build"

  [build.env]
    NODE_ENV = "production"
    NEXT_TELEMETRY_DISABLED = "1"
    NIXPACKS_NODE_VERSION = "22.23.1"

[buildConfig]
  buildCommand    = "npm run build"
  startCommand    = "npx next start -p ${PORT:-3000}"
  nixpacksNodeVersion  = "22.23.1"
  nixpacksPlanVersion  = "0.7"
  nixpacksProviders    = "..."

[deploy]
  startCommand   = "npx next start -p ${PORT:-3000} --hostname 0.0.0.0"
  healthcheckPath        = "/"
  healthcheckTimeout     = 600
  healthcheckInterval    = 15
  restartPolicyType      = "on_failure"
  restartPolicyMaxRetries = 15

  [deploy.env]
    NODE_ENV = "production"
    HOSTNAME = "0.0.0.0"
    PORT     = "${PORT:-3000}"
