[build]
  builder = "NIXPACKS"
  buildCommand = "npm run build"

  [build.env]
    NODE_ENV = "production"
    NEXT_TELEMETRY_DISABLED = "1"

[deploy]
  startCommand = "npm run start"
  healthcheckPath = "/"
  healthcheckTimeout = 300
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10
