[build]
  builder = "NIXPACKS"
  buildCommand = "npm run build"

  [build.env]
    NODE_ENV = "production"
    NEXT_TELEMETRY_DISABLED = "1"
    NIXPACKS_NODE_VERSION = "22.23.1"

[buildConfig]
  buildCommand = "npm run build"
  startCommand = "npm run start"
  nixpacksNodeVersion  = "22.23.1"
  nixpacksPlanVersion  = "0.7"
  nixpacksProviders    = "..."

[deploy]
  startCommand = "npm run start"
  healthcheckPath = "/"
  healthcheckTimeout = 300
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10
